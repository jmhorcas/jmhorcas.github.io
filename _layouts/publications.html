---
layout: default
---
{% assign t = site.data.i18n %}

{% include publication_stats.html %}

{% assign items = site.data.publications | sort: "date" | reverse %}

<h1 class="prose">{{ page.title }} ({{items.size}})</h1>

<div class="bibtexviz-link">
  <a title="Explore my publications with BibTexViz" href="https://bibtexviz.github.io/?researcher=Jos%C3%A9%20Miguel%20Horcas&source=https://raw.githubusercontent.com/jmhorcas/jmhorcas.github.io/refs/heads/main/assets/bib/publications.bib" target="_blank" rel="noopener noreferrer">
    <span>Explore my publications with <strong>BibTexViz</strong> ↗</span>
    <img src="/assets/img/software/bibtexviz.png"
         alt="BibTexViz">
    </a>
</div>

<div class="filter-wrapper">
  <!-- Nivel 1: Principal -->
  <div class="filter-container">
    <div class="filter-switch-group">
      <label class="switch-label">
        <input type="radio" name="pub-filter" value="all" checked onclick="filterTimeline('all')">
        <span class="switch-text">{{t.all[page.lang]}} <span data-count="all" class="badge">0</span></span>
      </label>
      <label class="switch-label">
        <input type="radio" name="pub-filter" value="journal" onclick="filterTimeline('journal')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #c32b72;"></i>{{t.journals[page.lang]}} <span data-count="journal" class="badge">0</span></span>
      </label>
      <label class="switch-label">
        <input type="radio" name="pub-filter" value="conference" onclick="filterTimeline('conference')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #196ca3;"></i>{{t.conferences[page.lang]}} <span data-count="conference" class="badge">0</span></span>
      </label>
      <label class="switch-label">
        <input type="radio" name="pub-filter" value="other" onclick="filterTimeline('other')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #ffd500;"></i>{{t.others[page.lang]}} <span data-count="other" class="badge">0</span></span>
      </label>
    </div>
  </div>

  <!-- Nivel 2: Subfiltro de Conferencias -->
  <div class="filter-container sub-container" data-show-on="conference,international-conference,workshop,national-conference" style="display: none;">
    <div class="filter-switch-group sub-group">
      <label class="switch-label sub">
        <input type="radio" name="sub-filter" value="conference" checked onclick="filterTimeline('conference')">
        <span class="switch-text">{{t.all[page.lang]}} <span data-count="conference" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="sub-filter" value="international-conference" onclick="filterTimeline('international-conference')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #196ca3;"></i>{{t.internationals[page.lang]}} <span data-count="international-conference" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="sub-filter" value="workshop" onclick="filterTimeline('workshop')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #2ecc71;"></i>{{t.workshops[page.lang]}} <span data-count="workshop" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="sub-filter" value="national-conference" onclick="filterTimeline('national-conference')">
        <span class="switch-text"><i class="fa-solid fa-circle" style="color: #e68019;"></i>{{t.nationals[page.lang]}} <span data-count="national-conference" class="badge">0</span></span>
      </label>
    </div>
  </div>

  <!-- Nivel 3: Subfiltro de Tracks -->
  <div class="filter-container sub-container level-3" data-show-on="international-conference,international-conference-main,international-conference-short,international-conference-industrial,international-conference-tool,international-conference-tutorial,international-conference-phd-symposium" style="display: none;">
    <div class="filter-switch-group sub-group tracks-group">
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference" checked onclick="filterTimeline('international-conference')">
        <span class="switch-text">{{t.all[page.lang]}} <span data-count="international-conference" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-main" onclick="filterTimeline('international-conference-main')">
        <span class="switch-text">{{t.main_track[page.lang]}} <span data-count="international-conference-main" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-short" onclick="filterTimeline('international-conference-short')">
        <span class="switch-text">{{t.short_paper[page.lang]}} <span data-count="international-conference-short" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-industrial" onclick="filterTimeline('international-conference-industrial')">
        <span class="switch-text">{{t.industrial[page.lang]}} <span data-count="international-conference-industrial" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-tool" onclick="filterTimeline('international-conference-tool')">
        <span class="switch-text">{{t.tool_track[page.lang]}} <span data-count="international-conference-tool" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-tutorial" onclick="filterTimeline('international-conference-tutorial')">
        <span class="switch-text">{{t.tutorial[page.lang]}} <span data-count="international-conference-tutorial" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="international-conference-track-filter" value="international-conference-phd-symposium" onclick="filterTimeline('international-conference-phd-symposium')">
        <span class="switch-text">{{t.phd_symposium[page.lang]}} <span data-count="international-conference-phd-symposium" class="badge">0</span></span>
      </label>
    </div>
  </div>

  <!-- Nivel 3: Subfiltro de Tracks -->
  <div class="filter-container sub-container level-3" data-show-on="national-conference,national-conference-main,national-conference-short,national-conference-industrial,national-conference-tool,national-conference-tutorial,national-conference-phd-symposium" style="display: none;">
    <div class="filter-switch-group sub-group tracks-group">
      <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference" checked onclick="filterTimeline('national-conference')">
        <span class="switch-text">{{t.all[page.lang]}} <span data-count="national-conference" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-main" onclick="filterTimeline('national-conference-main')">
        <span class="switch-text">{{t.main_track[page.lang]}} <span data-count="national-conference-main" class="badge">0</span></span>
      </label>
      <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-short" onclick="filterTimeline('national-conference-short')">
        <span class="switch-text">{{t.short_paper[page.lang]}} <span data-count="national-conference-short" class="badge">0</span></span>
      </label>
      <!-- <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-industrial" onclick="filterTimeline('national-conference-industrial')">
        <span class="switch-text">{{t.industrial[page.lang]}} <span data-count="national-conference-industrial" class="badge">0</span></span>
      </label> -->
      <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-tool" onclick="filterTimeline('national-conference-tool')">
        <span class="switch-text">{{t.tool_track[page.lang]}} <span data-count="national-conference-tool" class="badge">0</span></span>
      </label>
      <!-- <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-tutorial" onclick="filterTimeline('national-conference-tutorial')">
        <span class="switch-text">{{t.tutorial[page.lang]}} <span data-count="national-conference-tutorial" class="badge">0</span></span>
      </label> -->
      <label class="switch-label sub">
        <input type="radio" name="national-conference-track-filter" value="national-conference-phd-symposium" onclick="filterTimeline('national-conference-phd-symposium')">
        <span class="switch-text">{{t.phd_symposium[page.lang]}} <span data-count="national-conference-phd-symposium" class="badge">0</span></span>
      </label>
    </div>
  </div>
</div>

{% include timeline.html items=items type="publication" %}
