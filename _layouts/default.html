{% assign lang = page.lang | default: "en" %}
<!DOCTYPE html>
<html lang="{{ lang }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url | replace: '/es/', '/' }}" />
    <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.url | prepend: '/es' | replace: '//', '/' }}" />
    <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url | replace: '/es/', '/' }}" />

    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body class="bg-global-bg text-global-text antialiased">

    <!-- Included Header Component -->
    {% include header.html %}

    <!-- Main Content -->
    <main class="mx-auto max-w-3xl px-4 sm:px-8">
        <section class="mb-16">
            <div class="prose gap-8">
                {{ content }}
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mx-auto max-w-3xl px-4 sm:px-8 py-8 text-center text-sm opacity-75">
        <p>&copy; {{ site.time | date: '%Y' }} - {{ site.title }}</p>
    </footer>

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/utils.js' | relative_url }}"></script>

    <script>
    document.querySelectorAll('.format-number').forEach(el => {
        const num = parseFloat(el.innerText);
        
        // Detecta el idioma de la página (configurado en tu _config.yml o front matter)
        const lang = document.documentElement.lang || 'en'; 

        // Formateamos el número
        const formatted = new Intl.NumberFormat(lang, {
        minimumFractionDigits: 2, // Fuerza a que siempre haya 2 decimales (ej: 1.50)
        maximumFractionDigits: 2  // Redondea a un máximo de 2 decimales
        }).format(num);

        el.innerText = formatted;
    });
    </script>
</body>
</html>
